<!doctype html>
<!-- ⚠️ style 里的背景色是**故意内联**的，不是重复。
     坑：刷新的一瞬间会闪一下黑。因为这页常被嵌在 dsh 的暗色界面里
     （iframe），在 CSS 解析完之前，透出来的是父页面的深色底 ——
     看着就像"黑的技能树"。内联背景在 HTML 一到达就生效，不给透底的机会。
     改配色时记得这一处也要跟着改（就这一行，别的地方还是走变量）。 -->
<html lang="zh-CN" data-theme="light" style="background:#eef5fc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 声明本页是浅色的。不加这条的话，系统处于暗色模式时浏览器会用深色
     渲染"还没加载完"的页面（默认背景/滚动条/表单控件）—— 和上面内联背景
     是防的同一件事，两个都要。 -->
<meta name="color-scheme" content="light">
<title>小鲸教练 · 知识地图</title>
<style>
/* ═══ 色板照抄 VP 平台 frontend/src/index.css ═══
   双轨制：色块轨(--X) 管描边/淡底，只要 3:1；文字轨(--X-text) 管 color:，压深过 4.5:1。
   学科色同理 —— 只做描边和淡底，正文字色一律 --text-1，所以不必压深。 */
:root{
  --bg-0:#eef5fc; --bg-1:#ffffff; --bg-2:#f6fafe; --bg-3:#e6effa;
  --fill-0:rgba(13,27,42,.028); --fill-1:rgba(13,27,42,.045); --fill-2:rgba(13,27,42,.07);
  --header-bg:rgba(255,255,255,.82); --surface:rgba(255,255,255,.72);
  --stroke:rgba(13,27,42,.085); --stroke-strong:rgba(13,27,42,.16);
  --text-1:#0d1b2a; --text-2:#3d4f66; --text-3:#5a6b82; --text-4:#62708a; --text-5:#78889e;
  --brand:#2b7fe0; --brand-fill:#1a6fd4; --brand-soft:rgba(43,127,224,.10);
  --brand-glow:rgba(43,127,224,.22); --brand-text:#14589f;
  --ac:#16a24a; --ac-text:#0f7a3d; --wa:#dc2626; --tle:#d97706;
  --ac-soft:rgba(22,162,74,.09); --ac-s:rgba(22,162,74,.38);
  --radius-xs:6px; --radius-s:10px; --radius-m:14px; --radius-l:20px; --radius-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --shadow-1:0 1px 2px rgba(13,27,42,.05),0 4px 12px rgba(13,27,42,.05);
  --shadow-2:0 2px 8px rgba(13,27,42,.07),0 16px 40px rgba(13,27,42,.09);
  --glow-brand:0 0 0 1px rgba(43,127,224,.18),0 0 20px rgba(43,127,224,.11);
  --ease-spring:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --speed-1:150ms; --speed-2:280ms;
  --card-stroke:rgba(13,27,42,.13); --node-tint:.05; --dim:.16;
  /* 重点色阶。**不用色相，用"从实到虚"** —— 10 个学科色已经把色相占满了，
     再塞 4 个新色相就分不清哪个维度是哪套。重点本来就是"等级"不是"类别"。
     skip 额外配虚线描边（形状通道），不只靠颜色区分。 */
  --tier-core:#1a6fd4; --tier-normal:#0e9aa7; --tier-rare:#93a4b8; --tier-skip:#c2ccd8;
  /* planned 块（教练排的训练）。**不占新色相** —— 10 个学科色 + 6 个事由色
     已经把色相分完了，再塞一个谁也说不清哪套是哪套。
     换成**另一套视觉语言**：busy 是实心渐变（已经发生的事实），
     planned 是描边 + 半透明底（还没发生的计划）。扫一眼就分得开。 */
  --pl-ink:#14589f; --pl-line:rgba(43,127,224,.62); --pl-solid:rgba(43,127,224,.26);
  --pl-1:rgba(43,127,224,.34); --pl-2:rgba(43,127,224,.20); --pl-3:rgba(43,127,224,.09);
}
html[data-theme="dark"]{
  --bg-0:#071528; --bg-1:#0d2138; --bg-2:#122a46; --bg-3:#17334f;
  --fill-0:rgba(255,255,255,.02); --fill-1:rgba(255,255,255,.055); --fill-2:rgba(255,255,255,.09);
  --header-bg:rgba(13,33,56,.72); --surface:rgba(255,255,255,.045);
  --stroke:rgba(255,255,255,.075); --stroke-strong:rgba(255,255,255,.14);
  --text-1:#eef4fb; --text-2:#a9bcd4; --text-3:#8ba0bd; --text-4:#7e93af; --text-5:#748aa6;
  --brand:#4aa3f7; --brand-fill:#1f6fd0; --brand-soft:rgba(74,163,247,.14);
  --brand-glow:rgba(74,163,247,.28); --brand-text:#9ed0ff;
  --ac:#3fd968; --ac-text:#3fd968; --wa:#ff5c52; --tle:#ffa726;
  --ac-soft:rgba(63,217,104,.12); --ac-s:rgba(63,217,104,.42);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  --shadow-2:0 2px 8px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.35);
  --glow-brand:0 0 0 1px rgba(74,163,247,.28),0 0 20px rgba(74,163,247,.22);
  --card-stroke:rgba(255,255,255,.11); --node-tint:.10; --dim:.12;
  --tier-core:#4aa3f7; --tier-normal:#2dd4bf; --tier-rare:#7e93af; --tier-skip:#4c5c72;
  --pl-ink:#9ed0ff; --pl-line:rgba(74,163,247,.58); --pl-solid:rgba(74,163,247,.24);
  --pl-1:rgba(74,163,247,.32); --pl-2:rgba(74,163,247,.19); --pl-3:rgba(74,163,247,.09);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg-0); color:var(--text-1);
  font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",
       "PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  display:grid; grid-template-rows:auto 1fr; grid-template-columns:auto 1fr;
  grid-template-areas:"hdr hdr" "side stage";
  transition:background var(--speed-2) var(--ease-out);
}

/* ── 顶栏 ── */
.hdr{
  grid-area:hdr; display:flex; align-items:center; gap:var(--sp-4);
  padding:10px var(--sp-5); background:var(--header-bg);
  backdrop-filter:blur(20px) saturate(1.4); border-bottom:1px solid var(--stroke);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand .vp-ico{color:var(--brand)}
.brand small{color:var(--text-3);font-weight:500;font-size:12.5px;letter-spacing:0}

/* 图标统一用 VP 那套内联 SVG（components/Icon.jsx 的 ICO_PATHS）。
   规格：24 视口 / 1.75 线宽 / 圆头圆角 / currentColor —— 颜色由父级 color 决定。 */
.vp-ico{flex:none;vertical-align:-.14em;display:inline-block}
.icon-btn .vp-ico,.leg .vp-ico{vertical-align:0}
.search .vp-ico{color:var(--text-5);pointer-events:none}
.hdr .spacer{flex:1}

.seg{display:flex;padding:2px;background:var(--fill-1);border-radius:var(--radius-pill);gap:2px}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--text-3);
  font:inherit;font-size:12.5px;font-weight:550;padding:5px 13px;border-radius:var(--radius-pill);
  cursor:pointer;transition:all var(--speed-1) var(--ease-out);white-space:nowrap;
}
.seg button:hover{color:var(--text-1)}
.seg button[aria-pressed="true"]{background:var(--bg-1);color:var(--text-1);box-shadow:var(--shadow-1)}

.search{
  display:flex;align-items:center;gap:6px;padding:0 11px;height:32px;min-width:190px;
  background:var(--fill-1);border:1px solid transparent;border-radius:var(--radius-pill);
  transition:all var(--speed-1) var(--ease-out);
}
.search:focus-within{background:var(--bg-1);border-color:var(--brand);box-shadow:var(--glow-brand)}
.search input{
  appearance:none;border:0;background:transparent;color:var(--text-1);
  font:inherit;font-size:13px;width:100%;outline:none;
}
.search input::placeholder{color:var(--text-5)}
.icon-btn{
  appearance:none;border:1px solid var(--stroke);background:var(--bg-1);color:var(--text-2);
  width:32px;height:32px;border-radius:var(--radius-s);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:all var(--speed-1) var(--ease-out);
}
.icon-btn:hover{border-color:var(--stroke-strong);color:var(--text-1);transform:translateY(-1px)}

/* ── 左侧图例 / 筛选 ── */
.side{
  grid-area:side; width:216px; padding:var(--sp-4) var(--sp-3) var(--sp-4) var(--sp-4);
  overflow-y:auto; border-right:1px solid var(--stroke); background:var(--bg-2);
}
.side h2{
  margin:0 0 10px; font-size:11px; font-weight:650; letter-spacing:.07em;
  text-transform:uppercase; color:var(--text-4);
}
.leg{display:flex;flex-direction:column;gap:2px}
.leg button{
  appearance:none;border:0;background:transparent;font:inherit;text-align:left;
  display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:var(--radius-xs);
  cursor:pointer;color:var(--text-2);font-size:13px;transition:all var(--speed-1) var(--ease-out);
}
.leg button:hover{background:var(--fill-1);color:var(--text-1)}
.leg button[aria-pressed="false"] .nm{opacity:.38;text-decoration:line-through}
.leg button[aria-pressed="false"] .dot{opacity:.28}
.dot{width:9px;height:9px;border-radius:3px;flex:none;transition:opacity var(--speed-1)}
.leg .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .ct{color:var(--text-5);font-size:11.5px;font-variant-numeric:tabular-nums}
.side hr{border:0;border-top:1px solid var(--stroke);margin:var(--sp-4) 0}
.meta{font-size:12px;color:var(--text-3);line-height:1.75;font-variant-numeric:tabular-nums}
.meta b{color:var(--text-1);font-weight:600}
.note{
  margin-top:var(--sp-4); padding:9px 11px; border-radius:var(--radius-s);
  background:var(--brand-soft); border:1px solid var(--stroke);
  font-size:11.5px; line-height:1.6; color:var(--text-3);
}
.note b{color:var(--brand-text)}
/* 写进度失败时变红。没有现成的 danger token，就地补一对（明暗各一）。 */
.note.err{background:#fdecea;border-color:#f3b7b0;color:#a3241a}
html[data-theme="dark"] .note.err{background:#3a1a17;border-color:#6b2b24;color:#ff9d92}
.note code{font-size:11px}

/* ── 画布 ── */
.stage{
  grid-area:stage; position:relative; overflow:hidden; cursor:grab;
  background:
    radial-gradient(1100px 520px at 22% -12%,var(--brand-soft),transparent 62%),
    var(--bg-0);
  /* 图里每个标签都是 <text>，默认全都能被框选 —— 拖动平移时会糊出一片蓝色高亮。
     画布整体禁掉选区；详情面板和输入框再单独放开。 */
  user-select:none; -webkit-user-select:none;
  -webkit-user-drag:none; touch-action:none;
}
.stage.dragging{cursor:grabbing}
.stage.dragging *{cursor:grabbing !important}
/* 面板里的知识点名是可以复制的，别一起禁了 */
.panel, .panel *{user-select:text; -webkit-user-select:text}
svg{display:block;transform-origin:0 0;will-change:transform}
.band{fill:var(--fill-0)}
.bandline{stroke:var(--stroke);stroke-width:1;stroke-dasharray:2 6}
.bandlabel{fill:var(--text-5);font-size:11px;font-weight:600;letter-spacing:.06em;
  font-variant-numeric:tabular-nums}
.bandcount{fill:var(--text-5);font-size:10.5px;font-weight:500}

.edge{stroke:var(--stroke-strong);stroke-width:1.25;fill:none;transition:all var(--speed-1) var(--ease-out)}
.edge.hot{stroke:var(--brand);stroke-width:2.1}
.edge.dim{opacity:var(--dim)}
#arrow{fill:var(--stroke-strong)}
#arrowHot{fill:var(--brand)}

/* 节点 = 中性白卡片 + 一个学科色圆点。
   早先试过整格铺学科淡底 —— 349 格铺满颜色就是一面彩色药丸墙，
   颜色互相打架，读不出层级。颜色降级成圆点后，跟左侧图例也呼应上了。 */
.node{cursor:pointer}
/* fallback 值**不是装饰**：节点是顶层同步循环造出来的，而 --nc-fill 要等
   fetch 进度回来才设上。中间那几十毫秒里 var() 取不到值 → SVG 默认黑，
   那个瞬间被抓到过（满屏黑块）。给了 fallback 至少是淡色不吓人。 */
.node .chip{
  fill:var(--nc-fill,#e7eef8); stroke:var(--card-stroke); stroke-width:1;
  transition:all var(--speed-1) var(--ease-out);
}
.node .ndot{fill:var(--nc,#b9c8d8);transition:fill var(--speed-1) var(--ease-out)}
.node text{
  fill:var(--text-1); font-size:12.5px; font-weight:550;
  text-anchor:start; dominant-baseline:central; pointer-events:none;
}
.node:hover .chip{stroke:var(--nc-s);stroke-width:1.5}
.node.hot .chip{stroke:var(--nc);stroke-width:1.8}
.node.hot text{font-weight:680}
.node.dim{opacity:var(--dim)}
/* skip 类加虚线描边 —— **形状通道**，不只靠颜色。
   「这个不用学」是个强判断，不该只体现在一个更浅的蓝色上（色觉障碍、屏幕差都看不见）。 */
.node.tier-skip .chip{stroke-dasharray:4 3}
/* 段位标签：贴在节点右端，弱到不该抢名字的注意力 */
.node .entry{
  text-anchor:end; fill:var(--text-5); font-size:10.5px;
  font-weight:600; font-variant-numeric:tabular-nums;
}
.node.done .chip{fill:var(--ac-soft);stroke:var(--ac-s)}
.node.done .ndot{fill:var(--ac)}
/* 「在学」单独一种 —— 它和「学过」不是一回事，不能共用样式。
   用琥珀（--tle 那支），和「学过」的绿、「已验证」的绿底区分开。 */
.node.studying .chip{fill:var(--tle);fill-opacity:.10;stroke:var(--tle);stroke-opacity:.55}
.node.studying .ndot{fill:var(--tle)}
/* 「游标」用**形状**区分而不是颜色 —— 颜色已经被状态占满了。
   虚线加粗，扫一眼就知道今天该看哪。 */
.node.cursor .chip{stroke:var(--brand);stroke-width:2.2;stroke-dasharray:6 3}
.node.cursor text{font-weight:680}

/* ── 详情面板 ── */
.panel{
  position:absolute;top:var(--sp-4);right:var(--sp-4);width:290px;max-height:calc(100% - 32px);
  overflow-y:auto;background:var(--bg-1);border:1px solid var(--stroke);
  border-radius:var(--radius-m);box-shadow:var(--shadow-2);padding:var(--sp-4);
  transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;
  transition:transform var(--speed-2) var(--ease-spring),opacity var(--speed-2) var(--ease-out);
}
.panel.on{transform:none;opacity:1;pointer-events:auto}
.panel .ttl{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 6px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--sp-3)}
.tag{
  font-size:11.5px;font-weight:550;padding:3px 9px;border-radius:var(--radius-pill);
  background:var(--fill-1);color:var(--text-2);
}
.tag.dom{background:var(--nc);color:var(--text-1);border:1px solid var(--nc-s)}
/* 面板里的状态标签：四种各一色，和图上一致 */
.tag.st{background:var(--fill-2);color:var(--text-1)}
.tag.st[data-st="studying"]{background:var(--tle);color:#fff}
.tag.st[data-st="learned"]{background:var(--brand-fill);color:#fff}
.tag.st[data-st="verified"]{background:var(--ac);color:#fff}
.tag.st[data-st="none"]{background:var(--fill-2);color:var(--text-3)}
.tag.cur{background:var(--brand-soft);color:var(--brand-text);border:1px dashed var(--brand)}
/* 「多久没碰了」—— 从日期算出来的，不是手标的状态。
   7 天以内不额外提示（刚学的本来就正常），8~30 天转琥珀，30 天开外转红：
   那时候基本等于忘了。**是提醒不是判决** —— 它不拦任何操作。 */
.tag.age{background:var(--fill-1);color:var(--text-3)}
.tag.age-warm{background:rgba(217,119,6,.11);color:#8a5208}
.tag.age-stale{background:rgba(220,38,38,.11);color:#a11d1d}

/* ══ 日程视图（L6 时间容量）════════════════════════════════════════
   审美跟 VP 一套：蓝白、卡片、圆角、轻阴影、悬停有回馈。

   几个刻意的决定（都不是随手定的）：
   · **10 天全展开，不做翻页** —— 滚动窗口本来就是"一眼看全"才叫窗口
   · **回顾期（今天-3 ～ 今天-1）压暗** —— 过去的天只读，但得看得见
     （不然会忘掉前天干了什么），所以不是藏起来是压暗
   · **1 小时一格**，不做半小时 —— 半小时太碎，点起来像扫雷
   · **busy 用斜纹不用纯色** —— 纯色会和 planned 的实心块抢眼；
     斜纹在语义上是"背景"，实心块才是"内容"
   · **今天单独一列高亮**，不靠颜色深浅认 —— 10 列里认"哪列是今天"
     是高频动作，得一眼看到
*/
.viewseg{display:flex;gap:2px;background:var(--fill-1);padding:3px;border-radius:var(--radius-s)}
.viewseg button{
  font:inherit;font-size:12.5px;font-weight:550;color:var(--text-3);
  background:transparent;border:0;border-radius:7px;padding:5px 13px;cursor:pointer;
  transition:background var(--speed-1),color var(--speed-1);
}
.viewseg button:hover{color:var(--text-1)}
.viewseg button[aria-pressed="true"]{background:var(--bg-1);color:var(--brand-text);box-shadow:var(--shadow-1)}

/* ⚠️ body 本身是 grid（"hdr hdr" / "side stage"）—— 不显式给 grid-area 的话，
   日程会被自动放进**侧栏那一列**，卡片就只有 2/3 宽（踩过）。
   切到日程时把模板改成整行，它就占满宽度了。 */
.sched{grid-area:sched;display:none}
body[data-view="sched"]{grid-template-areas:"hdr hdr" "sched sched"}
body[data-view="sched"] .sched{display:flex;flex-direction:column}
body[data-view="sched"] #stage,
body[data-view="sched"] .side,
body[data-view="sched"] #panel{display:none!important}

/* overflow 必须是 auto 不能是 hidden —— 内容（工具栏+网格+两行图例）
   会超过视口高度，hidden 的话底下的颜色对照直接被裁掉，等于没写。
   「备注没改」这种反馈，一部分原因就是它压根看不见。 */
.sched{padding:var(--sp-5) var(--sp-5) var(--sp-4);overflow-y:auto;overflow-x:hidden}

.sched .card{flex:none;display:flex;flex-direction:column;margin-bottom:var(--sp-3);height:min(660px,60vh)}
.sched .legend2{flex:none}

/* ── 时间面：**不要格子，要连续的时间轴** ─────────────────────────
   第一版是"一格一小时"，太粗了（「1h 分块太大了」）——
   他要的是拉一段起止时间，而不是点格子。所以：
   · 视觉上只留**每小时一条淡线**当刻度（参考），不做离散格子
   · 交互是**按住拖**：落点吸附到 15 分钟，拖到哪算到哪
   · 松手弹个小框写「什么事」—— 备注是给小鲸看的，不是装饰
   数据结构没变（busy 本来就是 { from, to, label } 任意区间），只换交互。 */
.sgrid{display:grid;grid-template-columns:52px repeat(10,minmax(86px,1fr));
  grid-template-rows:auto 1fr;height:100%;min-height:0}
.sgrid .corner{background:var(--bg-2);border-bottom:1px solid var(--stroke)}
.sgrid .dh{padding:8px 6px 7px;text-align:center;background:var(--bg-2);
  border-bottom:1px solid var(--stroke);border-left:1px solid var(--stroke)}
.sgrid .dh .dow{font-size:11px;color:var(--text-4);font-weight:550}
.sgrid .dh .dnum{font-size:14px;color:var(--text-1);font-weight:650;font-variant-numeric:tabular-nums}
.sgrid .dh.today{background:var(--brand-soft)}
.sgrid .dh.today .dnum{color:var(--brand-text)}
.sgrid .dh.past{opacity:.55}

.sgrid .stimes{position:relative;background:var(--bg-2);border-right:1px solid var(--stroke)}
.sgrid .stimes span{position:absolute;right:8px;transform:translateY(-50%);
  font-size:10.5px;color:var(--text-5);font-variant-numeric:tabular-nums;line-height:1}
/* ⚠️ 这里**故意不画横向分割线**。这是明确要求去掉的：
   格子里那些每小时一条的横线看着乱，而左边的时间标签已经够定位了。
   （第一版还踩过 gradient + 缩放的坑，那些线在 150% 下会整条消失 ——
   干脆不要了，两个问题一起没。）
   留着的两条线各有用途：列边框（竖，分日期）、悬停跟随线（交互反馈）。 */
.sgrid .dcol{position:relative;border-left:1px solid var(--stroke);
  cursor:crosshair;overflow:hidden;touch-action:none}
.sgrid .dcol:hover{background-color:var(--fill-0)}
.sgrid .dcol.past{opacity:.45}
.sgrid .dcol.today{background-color:rgba(43,127,224,.045)}

/* 一段「有事」：实心暖色块 + 备注文字。跨小时是一条连续块，
   不是一格一格拼的 —— 拼的话接缝处会有 1px 缝，看着像没对齐。 */
/* 「有事」的色块。**颜色按事由自动分**（一条明确要求：不要全一个黄）。
   每套都压得够深，白字在 AA 以上；深色主题下靠 --ev-*-dark 换一档，
   不靠 opacity —— 半透明会让白字对比度掉下去。 */
/* 色相**故意收敛在蓝—靛—青**这一片（VP 的主色域），只留一个暖色给比赛。
   第一版用了红紫蓝绿青灰六个色相，反馈是「跟随机的一样」——
   六个色相摆一起就是彩虹，再准的映射看着也乱。邻近色域才显得是一套。 */
:root{
  --ev-amber:#d97706; --ev-amber-2:#c2660a;   /* 兜底（默认） */
  --ev-blue:#3b7ddd;  --ev-blue-2:#2b64bd;    /* 上课 */
  --ev-violet:#6366f1;--ev-violet-2:#4f52d6;  /* 活动 / 宣讲 */
  --ev-red:#d9534f;   --ev-red-2:#bf3f3b;     /* 比赛（唯一暖色，用来跳出来） */
  --ev-teal:#0d9488;  --ev-teal-2:#0a7a70;    /* 运动 */
  --ev-cyan:#0e7490;  --ev-cyan-2:#0b5f75;    /* 工作 / 兼职 */
  --ev-slate:#5c718a; --ev-slate-2:#4a5c72;   /* 生活（吃饭睡觉，最淡） */
}
.bbar{position:absolute;left:3px;right:3px;border-radius:5px;
  color:#fff;font-size:11px;font-weight:550;line-height:1.25;padding:3px 7px;
  overflow:hidden;cursor:pointer;transition:filter var(--speed-1);
  background:linear-gradient(180deg,var(--ev-amber),var(--ev-amber-2));
  box-shadow:0 1px 4px rgba(120,70,0,.25)}
.bbar:hover{filter:brightness(1.07)}
/* 文字按**块高**分三档。踩过：时间选得短，字直接被压没了。
   判据用**时长（分钟）**不用像素 —— 像素依赖列高（窗口一缩就变），
   分钟数是数据本身的属性，稳定。
     ≥75 分钟（1¼h）：时间一行 + 事由一行，信息全
     40~74 分钟（≈45min）：只放事由，挤一行居中
     <40 分钟：不放字，只留色条；完整信息挂 title，悬停可见 */
.bbar.s-full{padding:3px 7px}
.bbar.s-full .t{display:block;font-size:10px;opacity:.82;font-weight:500}
.bbar.s-mid{display:flex;align-items:center;padding:0 7px;font-size:10.5px;
  white-space:nowrap;overflow:hidden}
.bbar.s-mini{padding:0}
.bbar.c-blue  {background:linear-gradient(180deg,var(--ev-blue),var(--ev-blue-2));
  box-shadow:0 1px 4px rgba(30,70,150,.22)}
.bbar.c-violet{background:linear-gradient(180deg,var(--ev-violet),var(--ev-violet-2));
  box-shadow:0 1px 4px rgba(70,70,180,.22)}
.bbar.c-red   {background:linear-gradient(180deg,var(--ev-red),var(--ev-red-2));
  box-shadow:0 1px 4px rgba(150,45,40,.24)}
.bbar.c-teal  {background:linear-gradient(180deg,var(--ev-teal),var(--ev-teal-2));
  box-shadow:0 1px 4px rgba(8,90,82,.22)}
.bbar.c-cyan  {background:linear-gradient(180deg,var(--ev-cyan),var(--ev-cyan-2));
  box-shadow:0 1px 4px rgba(8,70,90,.22)}
.bbar.c-slate {background:linear-gradient(180deg,var(--ev-slate),var(--ev-slate-2));
  box-shadow:0 1px 4px rgba(40,55,75,.20)}
/* 没写事由的：斜纹，说明"这里有安排但没说是什么" */
.bbar.nolabel{background:repeating-linear-gradient(45deg,
  rgba(217,119,6,.36) 0 5px, rgba(217,119,6,.15) 5px 10px);color:#7a4300;
  box-shadow:none}

/* ── planned 块：教练排的训练 ────────────────────────────────────
   和 busy 走**两套视觉语言**（变量那儿的注释写了理由）：一个是描边空心的
   计划，一个是实心渐变的事实。
   循环块用**一段渐变**画出 40/10/10 的比例 —— 不用分割元素，多一层 DOM
   就多一处能画错的地方；而那个比例是块的灵魂：40 分钟到点必须停，
   止损点就守在这儿。
   **只读**：页面上不给改动入口。给了就会手滑改计划，
   那"计划 vs 实际"的对照就没了 —— 而那个对照正是排计划的意义。 */
.pbar{position:absolute;left:3px;right:3px;border-radius:5px;
  border:1.5px solid var(--pl-line);background:var(--pl-solid);
  color:var(--pl-ink);font-size:11px;font-weight:600;line-height:1.25;
  padding:2px 6px;overflow:hidden;cursor:default}
.pbar .t{display:block;font-size:10px;opacity:.78;font-weight:500}
.pbar.k-cycle{background:linear-gradient(180deg,
  var(--pl-1) 0 66.67%, var(--pl-2) 66.67% 83.33%, var(--pl-3) 83.33% 100%)}
.pbar.s-mini{padding:0;border-width:1px}

/* 拖选时的预览条 */
.selbar{position:absolute;left:3px;right:3px;border-radius:5px;pointer-events:none;
  background:rgba(217,119,6,.22);border:1px dashed rgba(217,119,6,.7)}

/* 悬停指示：一条横贯全宽的细线 + 跟着鼠标的时间标签。
   踩过「鼠标放上去看不到位置的时间，很容易选错」——
   光有刻度线不够，得让他在按下去**之前**就知道会选到哪一分钟。 */
.hoverline{position:fixed;height:1px;background:var(--brand);
  opacity:.6;pointer-events:none;z-index:40;transition:opacity var(--speed-1)}
.hoverlabel{position:fixed;pointer-events:none;z-index:41;
  background:var(--text-1);color:var(--bg-1);
  font:600 11px/1 var(--dsw-font-family,inherit);
  font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:5px;
  white-space:nowrap;box-shadow:var(--shadow-1)}

/* 写「什么事」的小浮层 */
.pop{position:fixed;z-index:60;width:236px;padding:12px;
  background:var(--bg-1);border:1px solid var(--stroke-strong);border-radius:var(--radius-s);
  box-shadow:var(--shadow-2)}
.pop .pt{font-size:12.5px;font-weight:650;color:var(--text-1);margin-bottom:8px;
  font-variant-numeric:tabular-nums}
.pop input{width:100%;box-sizing:border-box;font:inherit;font-size:13px;
  padding:7px 9px;border:1px solid var(--stroke-strong);border-radius:var(--radius-xs);
  background:var(--bg-0);color:var(--text-1);outline:none}
.pop input:focus{border-color:var(--brand);box-shadow:var(--glow-brand)}
.pop .prow{display:flex;gap:6px;margin-top:10px}
.pop .prow button{flex:1;font:inherit;font-size:12.5px;font-weight:600;
  padding:6px 0;border-radius:var(--radius-xs);cursor:pointer;border:1px solid var(--stroke-strong);
  background:var(--bg-2);color:var(--text-2)}
.pop .prow button.pri{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff}
.pop .prow button:hover{filter:brightness(1.05)}
.pop .prow button.del{flex:0 0 62px;color:var(--wa);border-color:rgba(220,38,38,.3)}
/* 「今天」按钮：纯图标按钮的宽度放不下两个字，会被挤成竖排 */
#schedToday{width:auto;padding:0 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.schedbar{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.schedbar h2{margin:0;font-size:15px;font-weight:650;color:var(--text-1)}
.schedbar .span{font-size:12.5px;color:var(--text-4);font-variant-numeric:tabular-nums}
.schedbar .spacer{flex:1}

.card{
  background:var(--bg-1);border:1px solid var(--stroke);border-radius:var(--radius-m);
  box-shadow:var(--shadow-1);overflow:hidden;
}
.grid{display:grid;grid-template-columns:56px repeat(10,minmax(88px,1fr))}
.grid .corner{background:var(--bg-2);border-bottom:1px solid var(--stroke)}
.grid .dh{
  padding:8px 6px 7px;text-align:center;background:var(--bg-2);
  border-bottom:1px solid var(--stroke);border-left:1px solid var(--stroke);
}
.grid .dh .dow{font-size:11px;color:var(--text-4);font-weight:550}
.grid .dh .dnum{font-size:14px;color:var(--text-1);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.grid .dh .dmon{font-size:10px;color:var(--text-5)}
.grid .dh.today{background:var(--brand-soft)}
.grid .dh.today .dnum{color:var(--brand-text)}
.grid .dh.past{opacity:.55}
.grid .hh{
  font-size:10.5px;color:var(--text-5);text-align:right;padding:0 7px 0 0;
  height:22px;line-height:22px;background:var(--bg-2);border-right:1px solid var(--stroke);
  font-variant-numeric:tabular-nums;
}
.grid .cell{
  height:22px;border-left:1px solid var(--stroke);border-top:1px dashed var(--stroke);
  cursor:pointer;position:relative;transition:background var(--speed-1);
}
.grid .cell:hover{background:var(--brand-soft)}
.grid .cell.busy{
  background-color:rgba(217,119,6,.08);
  background-image:repeating-linear-gradient(45deg,
    rgba(217,119,6,.30) 0 4px, transparent 4px 9px);
  cursor:pointer;
}
.grid .cell.busy:hover{background-color:rgba(217,119,6,.16)}
.grid .cell.past{opacity:.45}
.grid .cell.today{border-left-color:var(--brand)}

/* 排好的块：浮在格子上的实心条 */
.blk{
  position:absolute;left:2px;right:2px;top:1px;bottom:1px;
  border-radius:5px;background:linear-gradient(180deg,var(--brand),var(--brand-fill));
  color:#fff;font-size:10px;line-height:20px;padding:0 6px;overflow:hidden;white-space:nowrap;
  box-shadow:0 1px 3px rgba(43,127,224,.35);pointer-events:none;
}
.blk.k-resolve{background:linear-gradient(180deg,#5b9be8,#4a86d8)}
.blk.k-rewrite{background:linear-gradient(180deg,#7fb3ee,#6a9fe0)}
.blk.k-review{background:linear-gradient(180deg,#0e9aa7,#0b8792)}
.blk.k-test{background:linear-gradient(180deg,#7c5cd6,#6a4bc4)}

.legend2{display:flex;gap:16px;align-items:center;margin-top:var(--sp-3);font-size:12px;color:var(--text-3);flex-wrap:wrap}
.legend2 i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.legend2 i.busy{background-color:rgba(217,119,6,.10);background-image:repeating-linear-gradient(45deg,rgba(217,119,6,.32) 0 3px,transparent 3px 6px)}
.legend2 i.plan{background:var(--pl-solid);border:1.5px solid var(--pl-line)}
.legend2 .hint{margin-left:auto;color:var(--text-4)}
.legend3{display:flex;gap:14px;align-items:center;margin-top:7px;
  font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.legend3 .lt{color:var(--text-5);font-weight:600;letter-spacing:.02em}
.legend3 .lt2{color:var(--text-4)}
.legend3 span{display:inline-flex;align-items:center;gap:5px}
.legend3 .sw{display:inline-block;width:12px;height:9px;border-radius:3px}
.sw-blue{background:var(--ev-blue)}
.sw-violet{background:var(--ev-violet)}
.sw-red{background:var(--ev-red)}
.sw-teal{background:var(--ev-teal)}
.sw-cyan{background:var(--ev-cyan)}
.sw-slate{background:var(--ev-slate)}
.sec{margin-top:var(--sp-4)}
.sec h3{
  margin:0 0 7px;font-size:11px;font-weight:650;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-4);
}
/* 检测记录 / 判因记录。数据是 L5 才落盘的，之前写进去了界面上看不见 ——
   那等于没写，是这个项目一直在治的病。 */
.hist{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.hrow{
  display:flex;align-items:baseline;gap:var(--sp-2);
  padding:5px 8px;border-radius:var(--radius-xs);
  background:var(--fill-0);border:1px solid var(--stroke);
  font-size:12.5px;
}
.hrow b{flex:none;font-weight:680}
.ho-passed{color:var(--ac-text)}
.ho-overTime{color:var(--tle)}
.ho-failed{color:var(--wa)}
.hc{color:var(--brand-text)}
.hd{flex:none;color:var(--text-4);font-variant-numeric:tabular-nums}
.hs{flex:1;min-width:0;color:var(--text-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.he{flex:none;color:var(--text-5);font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  appearance:none;font:inherit;font-size:12px;padding:4px 10px;border-radius:var(--radius-xs);
  background:var(--fill-1);border:1px solid var(--stroke);color:var(--text-2);
  cursor:pointer;transition:all var(--speed-1) var(--ease-out);
}
.chip:hover{background:var(--bg-2);border-color:var(--stroke-strong);color:var(--text-1)}
.none{font-size:12px;color:var(--text-5)}
.acts{display:flex;gap:7px;margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--stroke)}
.btn{
  appearance:none;font:inherit;font-size:13px;font-weight:550;flex:1;padding:8px 12px;
  border-radius:var(--radius-s);cursor:pointer;border:1px solid var(--stroke);
  background:var(--bg-1);color:var(--text-2);transition:all var(--speed-1) var(--ease-out);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{border-color:var(--stroke-strong);color:var(--text-1)}
.btn.primary{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[data-on="1"]{background:var(--ac);border-color:var(--ac)}

.hint{
  position:absolute;left:var(--sp-5);bottom:var(--sp-4);font-size:11.5px;color:var(--text-5);
  background:var(--surface);backdrop-filter:blur(10px);padding:6px 12px;border-radius:var(--radius-pill);
  border:1px solid var(--stroke);pointer-events:none;
}
kbd{
  font:inherit;font-size:10.5px;padding:1px 5px;border-radius:4px;
  background:var(--fill-2);color:var(--text-3);border:1px solid var(--stroke);
}
</style>
<script>
/* 主题要在**首次渲染之前**定下来。
   踩过：「调成暗色后刷新又变亮」—— 因为主题原来只写在 HTML 属性上，
   刷新就没了。存 localStorage 能解决持久化，但**必须在这段同步脚本里读**：
   放到 DOMContentLoaded 或者主脚本里，页面会先按浅色画一遍、再翻成暗色 ——
   对暗色用户就是白闪一下（和上一轮那个黑闪是同一个病的两面）。
   所以它得在 <head> 里、同步执行，抢在浏览器第一次画之前。 */
try {
  if (localStorage.getItem("coach.theme") === "dark") {
    document.documentElement.dataset.theme = "dark";
    document.documentElement.style.background = "#071528";   // 和内联背景同步，防透底
  }
} catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可，退回浅色 */ }
</script>
</head>
<body>

<header class="hdr">
  <div class="brand"><span data-ico="whale" data-size="20"></span><span>小鲸教练 · 知识地图</span>
    <small id="hdrCount"></small></div>
  <div class="viewseg" id="viewSeg" role="group" aria-label="视图">
    <button data-view="tree" aria-pressed="true">技能树</button>
    <button data-view="sched" aria-pressed="false">日程</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="modeSeg" role="group" aria-label="着色模式">
    <button data-mode="domain" aria-pressed="true">按学科</button>
    <button data-mode="state"  aria-pressed="false">按状态</button>
    <button data-mode="tier"   aria-pressed="false">按重点</button>
  </div>
  <label class="search"><span data-ico="search" data-size="15"></span>
    <input id="q" type="search" placeholder="搜知识点…" aria-label="搜索知识点"></label>
  <button class="icon-btn" id="wires" title="显示全部连线（会糊，慎用）" data-ico="link"></button>
  <button class="icon-btn" id="fit" title="回到全图（铺满宽度）" data-ico="expand"></button>
  <button class="icon-btn" id="theme" title="明暗切换" data-ico="moon"></button>
</header>

<aside class="side">
  <h2 id="legTitle">学科</h2>
  <div class="leg" id="legend"></div>
  <hr>
  <div class="meta" id="meta"></div>
  <div class="note" id="note">
    载入中…（这段是占位，真实状态由 <code>./api/progress</code> 覆盖）
  </div>
</aside>

<main class="stage" id="stage">
  <svg id="cv">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z"/>
      </marker>
      <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z"/>
      </marker>
    </defs>
    <g id="bands"></g><g id="edges"></g><g id="nodes"></g>
  </svg>
  <div class="panel" id="panel"></div>
  <div class="hint">滚轮缩放 · 拖拽平移 · <b>点节点看前置链和「多久没碰了」</b> ·
    选中后 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> = 未学/在学/学过（标完不跳，想往前走按
    <kbd>↓</kbd>/<kbd>→</kbd>）· 点空白/<kbd>Esc</kbd> 取消</div>
</main>

<!-- 日程视图（L6 时间容量）。和技能树同一张页面、同一套样式 ——
     两份实现就是两份真相，所以它是"另一个视图"不是"另一个页面"。 -->
<section class="sched" id="sched">
  <div class="schedbar">
    <h2>日程</h2>
    <span class="span" id="schedSpan"></span>
    <div class="spacer"></div>
    <button class="icon-btn" id="schedPrev" title="窗口往前挪 3 天" data-ico="back"></button>
    <button class="icon-btn" id="schedToday" title="回到今天">今天</button>
    <button class="icon-btn" id="schedNext" title="窗口往后挪 3 天" data-ico="fwd"></button>
  </div>
  <div class="card"><div class="sgrid" id="schedGrid"></div></div>
  <div class="legend2">
    <span><i class="busy"></i>有事（拖一段标出来）</span>
    <span><i class="plan"></i>教练排的块：40 自己做 + 10 解决遗留 + 10 重写，排完固化</span>
    <span class="hint">按住拖出起止时间，松手写「什么事」· 点已有的块可改可删 · 回顾期只读</span>
  </div>
  <!-- 颜色对照。只写"按事由自动分"等于没说 —— 得让他一眼查到哪个色是哪类事，
       不然每次都得回忆（「备注没改」就是这么来的）。 -->
  <div class="legend3">
    <span class="lt">颜色对照</span>
    <span><i class="sw sw-blue"></i>上课 / 作业 / 考试</span>
    <span><i class="sw sw-violet"></i>活动 / 宣讲 / 开会</span>
    <span><i class="sw sw-red"></i>比赛</span>

  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  sun:    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:   '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>',
  link:   '<path d="M9.5 14.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7L11 7.3"/><path d="M14.5 9.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7L13 16.7"/>',
  check:  '<path d="m5 13 4.5 4.5L19 7"/>',
  expand: '<path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M15 20h5v-5"/><path d="M9 20H4v-5"/>',   // ← 按规格补的
  back:   '<path d="m14.5 6-6 6 6 6"/>',
  fwd:    '<path d="m9.5 6 6 6-6 6"/>',
};
const ico = (name, size = 16) =>
  `<svg class="vp-ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"`
  + ` stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"`
  + ` aria-hidden="true" focusable="false">${ICO[name] || ""}</svg>`;

const NODES = DATA.nodes, N = new Map(NODES.map(n => [n.id, n]));
const byId = (id) => N.get(id);

// ── 进度：从 PROGRESS.yaml 来（经 ./api/progress，相对路径）──────────
// 用相对路径是**故意的**：同一份 html 有两种挂法 ——
//   acmer-coach 插件的 /coach 路由（/coach/skilltree.html → /coach/api/progress）
//   serve_map.py 的离线预览（/skilltree.html → /api/progress）
// 写成绝对路径 /api/progress 就只会第二种通，在 dsh 里会打到 API 网关上。
// **这里绝不存第二份。** 之前标记存在 localStorage，那是两份真相：
// 页面显示「已学」，教练那边根本不知道。后来接上了真相源。
//
// 状态和 PROGRESS.yaml 里**逐字对齐**（别自己造词，否则又是两套词汇）：
//   none(未学) → studying(在学) → learned(学过·自评) → verified(已验证·过检测)
//
// ⚠️ CYCLE 只有**三级** —— verified 不在循环里。
// 手标不了它：自评不能冒充检测结论，已验证只能由 coach_grade 判卷产生。
// 键盘也从 1/2/3/4 改成 1/2/3。
// 但 verified 仍留在下面的 LABEL / COLOR 里 —— 那是**显示**用的：
// 节点可能真的过检测了，图上要认得出来。
const CYCLE = ["none", "studying", "learned"];
const STATUS_LABEL = { none: "未学", studying: "在学", learned: "学过", verified: "已验证" };
// [浅色, 深色] 两套 —— 和 VP 那边的双轨 token 一个道理，暗色下要提亮才看得清
const STATUS_COLOR = {
  none:     ["#9fb2c8", "#3d5470"],
  studying: ["#d97706", "#ffa726"],
  learned:  ["#2b7fe0", "#5aa9f0"],
  verified: ["#16a24a", "#3fd968"],
};
let progress = { cursor: "", nodes: {} };
const statusOf = (id) => progress.nodes?.[id]?.status ?? "none";

// ── 重点（tier）──────────────────────────────────────────────
// 回答的是另一个问题：地图只说「谁是谁的前置」——**允许**学什么；
// tier 说「这知识点重不重要」——**该不该**学。两条轴缺一不可。
//
// 颜色走 CSS 变量（--tier-*），因为色阶要跟主题联动；
// 但**形状通道**（skip 的虚线）在 CSS 里 —— 不能只靠颜色表达「这个不用学」。
const TIER_LABEL = { core: "核心", normal: "常见", rare: "少见", skip: "不考" };
const tierOf = (id) => byId(id)?.tier ?? "";
const entryOf = (id) => byId(id)?.entry ?? 0;
const tierColor = (t) =>
  getComputedStyle(document.documentElement).getPropertyValue(`--tier-${t || "rare"}`).trim();

function setNote(html, isError) {
  const el = $("#note");
  el.innerHTML = html;
  el.classList.toggle("err", Boolean(isError));
}
let noteTimer = null;
function toast(msg, isError) {
  setNote(msg, isError);
  clearTimeout(noteTimer);
  noteTimer = setTimeout(showStatus, isError ? 7000 : 2000);
}
function showStatus() {
  const all = Object.values(progress.nodes || {});
  const k = (s) => all.filter((x) => x?.status === s).length;
  setNote(
    `<b>进度读自 PROGRESS.yaml</b>（点节点循环：未学 → 在学 → 学过）。<br>` +
    `「已验证」手标不了 —— 它只能由检测产生。<br>` +
    `游标 <code>${progress.cursor || "（未设）"}</code>　` +
    `已验证 ${k("verified")} · 学过 ${k("learned")} · 在学 ${k("studying")}`
  );
}

async function loadProgress() {
  try {
    const r = await fetch("./api/progress");
    const j = await r.json();
    if (!j.ok) throw new Error(j.reject || "读进度失败");
    progress = { cursor: j.cursor || "", nodes: j.nodes || {} };
    showStatus();
  } catch (e) {
    // 读不到就**明说**，别退回「全部未学」—— 那看着像正常的空进度，
    // 实际是接口挂了，人会以为自己的标记丢了。
    setNote(`<b>进度读不到</b>：${e.message}<br>` +
      `标记会失败。查：页面是从哪来的（dsh 的 /coach 路由，还是 serve_map.py），那里就是接口的提供方。`, true);
    progress = { cursor: "", nodes: {} };
  }
  paint(); apply(); if (selected) panel(selected);
}

// 写进度：乐观更新 + 失败回滚。
// 点了没反应比点错了更让人困惑，所以先画再发；发失败了再退回去并说明。
async function postProgress(payload) {
  const r = await fetch("./api/progress", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.reject || "写失败");
  return j;
}

async function setStatus(id, status) {
  const before = JSON.parse(JSON.stringify(progress));
  if (status === "none") delete progress.nodes[id];
  else progress.nodes[id] = { ...(progress.nodes[id] || {}), status };
  paint(); apply(); if (selected === id) panel(id);
  try {
    await postProgress({ op: "mark", node: id, status });
    showStatus();
  } catch (e) {
    progress = before;
    paint(); apply(); if (selected === id) panel(id);
    toast(`<b>标记没存上</b>：${e.message}`, true);
  }
}

async function setCursor(id) {
  const before = progress.cursor;
  progress.cursor = id; paint();
  try {
    await postProgress({ op: "cursor", node: id });
    showStatus();
  } catch (e) {
    progress.cursor = before; paint();
    toast(`<b>游标没存上</b>：${e.message}`, true);
  }
}

let mode = "domain";          // domain | state
let hidden = new Set();       // 被筛掉的学科
let query = "";
let selected = null;
// 401 条边一起画必然是面条，而且盖住节点。默认一条不画，
// 悬停/选中某个节点时才把「它的祖先链 + 后代链」画出来 —— 这本来就是这张图的用法。
let showAll = false;

/* ── 祖先/后代闭包：悬停时高亮整条链 ── */
const ancCache = new Map(), desCache = new Map();
function ancestors(id) {
  if (ancCache.has(id)) return ancCache.get(id);
  const out = new Set(), st = [id];
  while (st.length) for (const p of byId(st.pop()).pre)
    if (!out.has(p)) { out.add(p); st.push(p); }
  ancCache.set(id, out); return out;
}
function descendants(id) {
  if (desCache.has(id)) return desCache.get(id);
  const out = new Set(), st = [id];
  while (st.length) for (const s of byId(st.pop()).suc)
    if (!out.has(s)) { out.add(s); st.push(s); }
  desCache.set(id, out); return out;
}

/* ── 画静态结构 ── */
const gBands = $("#bands"), gEdges = $("#edges"), gNodes = $("#nodes");
const svg = $("#cv");
svg.setAttribute("viewBox", `0 0 ${DATA.size[0]} ${DATA.size[1]}`);
svg.setAttribute("width", DATA.size[0]);
svg.setAttribute("height", DATA.size[1]);

DATA.bands.forEach((b, i) => {
  if (i % 2) gBands.appendChild(el("rect", { class: "band", x: 0, y: b.y,
    width: DATA.size[0], height: b.h, rx: 0 }));
  gBands.appendChild(el("line", { class: "bandline", x1: 24, x2: DATA.size[0] - 24, y1: b.y + 2, y2: b.y + 2 }));
  const t = el("text", { class: "bandlabel", x: 24, y: b.y + 22 });
  t.textContent = `L${b.depth}`;
  gBands.appendChild(t);
  const c = el("text", { class: "bandcount", x: 24 + 26, y: b.y + 22 });
  c.textContent = `${b.count} 个`;
  gBands.appendChild(c);
});

const nodeEls = new Map(), edgeEls = [];
for (const n of NODES) {
  for (const p of n.pre) {
    const a = byId(p), b = n;
    const y1 = a.y + a.h, y2 = b.y, x1 = a.x + a.w / 2, x2 = b.x + b.w / 2;
    const my = (y1 + y2) / 2;
    const path = el("path", { class: "edge", d: `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`,
      "marker-end": "url(#arrow)", "data-a": p, "data-b": b.id });
    gEdges.appendChild(path);
    edgeEls.push(path);
  }
}
for (const n of NODES) {
  const g = el("g", { class: "node", "data-id": n.id });
  g.appendChild(el("rect", { class: "chip", x: n.x, y: n.y, width: n.w, height: n.h, rx: 9 }));
  g.appendChild(el("circle", { class: "ndot", cx: n.x + 15, cy: n.y + n.h / 2, r: 4.6 }));
  const t = el("text", { x: n.x + 27, y: n.y + n.h / 2 + .5 });
  t.textContent = n.name;
  g.appendChild(t);
  // ⚠️ 必须**先入文档再量**。getComputedTextLength() 在游离元素上恒返回 0，
  // 而 `x+27+0+34 <= x+w-8` 对绝大多数节点都成立 —— 于是"量过再放"会变成
  // "无条件全放"，标签全压在名字上。这就是"验了个寂寞"。
  gNodes.appendChild(g);
  if (n.entry) {
    const need = 34;                       // "≈2300" + 右边距
    if (t.getComputedTextLength() + need <= n.w - 27 - 8) {
      const e = el("text", { class: "entry", x: n.x + n.w - 10, y: n.y + n.h / 2 + .5 });
      e.textContent = "≈" + n.entry;
      g.appendChild(e);
    }
  }
  nodeEls.set(n.id, g);
}

/* ── 着色 ── */
function paint() {
  const dark = document.documentElement.dataset.theme === "dark";
  for (const n of NODES) {
    const g = nodeEls.get(n.id);
    let c;
    const st = statusOf(n.id);
    if (mode === "state") {
      c = STATUS_COLOR[st][dark ? 1 : 0];
    } else if (mode === "tier") {
      c = tierColor(n.tier) || STATUS_COLOR.none[dark ? 1 : 0];
    } else {
      c = DATA.domainColors[n.domain][dark ? 1 : 0];
    }
    g.style.setProperty("--nc", c);
    g.style.setProperty("--nc-fill", hexA(c, dark ? .10 : .05));
    g.style.setProperty("--nc-s", hexA(c, dark ? .72 : .62));
    // 状态标记在两种着色模式下都要看得见。
    // 早先写成 mode==="state" 才加 done —— 结果在「按学科」模式点标记，屏幕上毫无反应。
    g.classList.toggle("done", st === "learned" || st === "verified");
    // 在学单独一个类：它和「学过」不是一回事，不能共用样式
    g.classList.toggle("studying", st === "studying");
    // 游标也要画出来 —— 它是「今天聚焦哪个」，和「学到什么程度」是两个维度
    g.classList.toggle("cursor", progress.cursor === n.id);
    // 「不考」用虚线描边，**形状通道**。它是条强判断（别浪费时间），
    // 不该只体现在一个更浅的蓝上。
    g.classList.toggle("tier-skip", n.tier === "skip");
  }
  $("#legTitle").textContent =
    mode === "state" ? "状态（点节点切换）" : mode === "tier" ? "重点" : "学科";
  buildLegend();
}

/* ── 图例 / 筛选 ── */
function buildLegend() {
  const box = $("#legend"); box.innerHTML = "";
  let entries;
  if (mode === "state") {
    // 图例走**状态字符串**，不再用 0/1/2 数字 —— 和 PROGRESS.yaml 一套词
    entries = CYCLE.slice().reverse().map((k) => {
      const label = STATUS_LABEL[k];
      const c = STATUS_COLOR[k][document.documentElement.dataset.theme === "dark" ? 1 : 0];
      const ct = NODES.filter((n) => statusOf(n.id) === k).length;
      return { key: "s:" + k, label, c, ct };
    });
  } else if (mode === "tier") {
    // 顺序定死 core → skip，图例本身就是优先级排序 —— 别按数量排，
    // 那会让「不考」跑到最上面。
    entries = ["core", "normal", "rare", "skip"].map((t) => {
      const ct = NODES.filter((n) => n.tier === t).length;
      return { key: "t:" + t, label: TIER_LABEL[t], c: tierColor(t), ct, dashed: t === "skip" };
    }).filter((e) => e.ct);
  } else {
    const cnt = {};
    for (const n of NODES) cnt[n.domain] = (cnt[n.domain] || 0) + 1;
    entries = Object.keys(DATA.domainColors)
      .filter(d => cnt[d])
      .map(d => ({ key: "d:" + d, label: d, c: DATA.domainColors[d][0], ct: cnt[d] }));
  }
  for (const e of entries) {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", hidden.has(e.key) ? "false" : "true");
    // skip 的色块画成虚线空心 —— 和节点上的描边同一套语言，
    // 图例和图上长得一样才认得出。
    const swatch = e.dashed
      ? `background:transparent;border:1.5px dashed ${e.c}`
      : `background:${e.c}`;
    b.innerHTML = `<span class="dot" style="${swatch}"></span>
      <span class="nm">${e.label}</span><span class="ct">${e.ct}</span>`;
    b.onclick = () => { hidden.has(e.key) ? hidden.delete(e.key) : hidden.add(e.key); apply(); };
    box.appendChild(b);
  }
}

/* ── 可见性 + 高亮 ── */
function visible(n) {
  // 筛选键按模式分流。**三种模式各自一套键** —— 在「按重点」里点到「核心」
  // 不该把「按学科」里的东西也筛掉，反过来也一样。
  if (mode === "state") {
    if (hidden.has("s:" + statusOf(n.id))) return false;
  } else if (mode === "tier") {
    if (hidden.has("t:" + (n.tier || "rare"))) return false;
  } else if (hidden.has("d:" + n.domain)) { return false; }
  if (query && !n.name.toLowerCase().includes(query)) return false;
  return true;
}

function apply() {
  const shown = new Set(NODES.filter(visible).map(n => n.id));
  for (const n of NODES) nodeEls.get(n.id).classList.toggle("hide", !shown.has(n.id));
  for (const n of NODES) nodeEls.get(n.id).style.display = shown.has(n.id) ? "" : "none";
  for (const p of edgeEls) {
    p.dataset.ok = (shown.has(p.dataset.a) && shown.has(p.dataset.b)) ? "1" : "0";
  }
  buildLegend();
  paintChain(selected);
  $("#hdrCount").textContent = `${shown.size} / ${NODES.length} 个知识点`;
}

// 只在**点选之后**才画路径。
// 早先是悬停触发 —— 鼠标扫过整张图就闪一下，不是"看"是"晃"。
// 悬停的反馈交给纯 CSS（.node:hover 加粗描边），不碰别的节点、不画线。
function paintChain(id) {
  const paintEdge = (e, inChain, allowed) => {
    if (!allowed || (!inChain && !showAll)) {
      // 隐藏时必须把类也清掉 —— 只设 display:none 会留下脏状态，
      // 之后一开「显示全部连线」就会冒出一批旧的 hot 边。
      e.style.display = "none";
      e.classList.remove("hot", "dim");
      return;
    }
    e.style.display = "";
    e.classList.toggle("hot", inChain);
    e.classList.toggle("dim", !inChain);
    e.setAttribute("marker-end", inChain ? "url(#arrowHot)" : "url(#arrow)");
  };
  if (!id) {
    nodeEls.forEach(g => g.classList.remove("hot", "dim"));
    edgeEls.forEach(e => paintEdge(e, false, e.dataset.ok === "1"));
    return;
  }
  const keep = new Set([id, ...ancestors(id), ...descendants(id)]);
  nodeEls.forEach((g, k) => { g.classList.toggle("hot", keep.has(k)); g.classList.toggle("dim", !keep.has(k)); });
  edgeEls.forEach(e => {
    // 这条边在链上 ⇔ 两端都在闭包里，且 a 确实是 b 的前置（方向不能反）
    const inChain = keep.has(e.dataset.a) && keep.has(e.dataset.b) &&
                    ancestors(e.dataset.b).has(e.dataset.a);
    paintEdge(e, inChain, e.dataset.ok === "1");
  });
}

/* ── 详情面板 ── */
/* 检测记录 + 判因记录 —— L5 刚落盘的两样东西。
   判因**按分类计数**：「不会」和「不认真」是两种病，混在一起看不出该治哪个。 */
function histSection(n) {
  const rec = progress.nodes?.[n.id] ?? {};
  const checks = Array.isArray(rec.checks) ? rec.checks : [];
  const diags = Array.isArray(rec.diagnoses) ? rec.diagnoses : [];
  if (!checks.length && !diags.length) return "";
  const OUTCOME = { passed: "过", overTime: "超时", failed: "没过" };
  const out = [];
  if (checks.length) {
    out.push(`<div class="sec"><h3>检测记录（${checks.length} 次）</h3><div class="hist">`
      + checks.slice(-4).reverse().map((c) =>
        `<div class="hrow"><b class="ho-${c.outcome}">${OUTCOME[c.outcome] ?? c.outcome}</b>`
        + `<span class="hd">${c.date ?? ""}</span>`
        + `<span class="hs">${c.score ?? "?"}/${c.maxScore ?? "?"} 分 · ${c.minutes ?? "?"}/${c.limit ?? "?"} 分钟</span>`
        + (c.verifiedAt ? `<span class="he">验证于 ≈${c.verifiedAt}</span>` : "")
        + `</div>`).join("")
      + `</div></div>`);
  }
  if (diags.length) {
    const byCat = {};
    for (const d of diags) byCat[d.category] = (byCat[d.category] || 0) + 1;
    const tally = Object.entries(byCat).map(([k, v]) => `${k}×${v}`).join(" · ");
    out.push(`<div class="sec"><h3>判因记录（${diags.length} 次　${tally}）</h3><div class="hist">`
      + diags.slice(-3).reverse().map((d) =>
        `<div class="hrow"><b class="hc">${d.category ?? ""}</b>`
        + `<span class="hd">${d.date ?? ""}</span>`
        + `<span class="hs" title="${(d.summary ?? "").replace(/"/g, "&quot;")}">${d.summary ?? ""}</span>`
        + `</div>`).join("")
      + `</div></div>`);
  }
  return out.join("");
}

/* 距今多少天。按**本地零点**算，不是拿时间戳直接减 ——
   直接减的话「昨天 23:00」和「今天 09:00」差 10 小时，取整成 0 天，
   显示「今天」，可它明明是昨天标的。零点对齐就没这问题。 */
function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  const n = new Date();
  return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - d) / 86400000);
}

/* 「多久没碰了」的标签。
   rec.at 是**状态变成的时间**（不是"最后点它"）—— 见 index.js 的 markStatus。
   没有 at 就什么都不显示：存量数据是早先标的，那时还没记这字段，
   下次标记会补上；在那之前显示「无日期」比不显示更让人困惑。 */
function ageTag(rec) {
  const days = daysSince(rec && rec.at);
  if (days === null) return "";
  const label = days <= 0 ? "今天" : days === 1 ? "昨天" : `${days} 天前`;
  const cls = days <= 7 ? "" : days <= 30 ? " age-warm" : " age-stale";
  return `<span class="tag age${cls}" title="${rec.at} 变成这个状态">`
    + label + (days > 30 ? " · 该复习了" : "") + `</span>`;
}

function panel(id) {
  const n = byId(id), p = $("#panel");
  if (!n) { p.classList.remove("on"); return; }
  const s = statusOf(id);
  const isCursor = progress.cursor === id;
  const chip = (x, cls = "") => `<button class="chip ${cls}" data-go="${x}">${x}</button>`;
  p.innerHTML = `
    <h2 class="ttl">${n.name}</h2>
    <div class="tags">
      <span class="tag dom">${n.domain}</span>
      <span class="tag st" data-st="${s}">${STATUS_LABEL[s]}</span>
      ${ageTag(progress.nodes?.[id])}
      ${isCursor ? '<span class="tag cur">▶ 当前游标</span>' : ''}
      ${n.tier ? `<span class="tag" title="赛场重不重要">${TIER_LABEL[n.tier] ?? n.tier}</span>` : ''}
      ${n.entry ? `<span class="tag" title="题池难度的 p25 —— 什么水平开始学得起">≈${n.entry}</span>` : ''}
      <span class="tag">L${n.depth}</span>
      <span class="tag">${n.pre.length} 前置 · ${n.suc.length} 后继</span>
    </div>
    ${histSection(n, s)}
    <div class="sec"><h3>前置（学会这些才轮到它）</h3>
      <div class="chips">${n.pre.length ? n.pre.map(x => chip(x)).join("") : '<span class="none">无 —— 这是根节点</span>'}</div></div>
    <div class="sec"><h3>后继（学完它能开这些）</h3>
      <div class="chips">${n.suc.length ? n.suc.map(x => chip(x)).join("") : '<span class="none">无 —— 它是叶子</span>'}</div></div>
    <div class="acts">
      <button class="btn primary" id="mark" data-on="${s === "verified" ? 1 : 0}">
        ${ico("check", 15)}${STATUS_LABEL[s]} → ${STATUS_LABEL[CYCLE[(CYCLE.indexOf(s) + 1) % CYCLE.length]]}</button>
      <button class="btn" id="cur" data-on="${isCursor ? 1 : 0}">
        ${isCursor ? "▶ 就是当前游标" : "设为游标"}</button>
      <button class="btn" id="close">关闭</button>
    </div>`;
  p.classList.add("on");
  p.querySelectorAll("[data-go]").forEach(b => {
    b.onclick = () => select(b.dataset.go, true);
  });
  p.querySelector("#close").onclick = () => select(null);
  // 点一下**前进一级**，绕完一圈回未学。
  // 按钮上直接写出「当前 → 下一个」，省得靠记忆猜点几下到哪。
  p.querySelector("#mark").onclick = () => {
    const next = CYCLE[(CYCLE.indexOf(statusOf(id)) + 1) % CYCLE.length];
    setStatus(id, next);
  };
  p.querySelector("#cur").onclick = () => setCursor(id);
}

function select(id, fly) {
  selected = id;
  paintChain(id);            // 别忘了这一行：悬停路径去掉后，画路径只剩这里
  panel(id);
  if (id && fly) focusNode(id);
}

/* ── 视口：缩放 / 平移 / 聚焦 ── */
let vx = 0, vy = 0, vs = 1;
function transform() { svg.style.transform = `translate(${vx}px,${vy}px) scale(${vs})`; }

// 节点造好、视口变量也就位了 —— **立刻**上色 + 定缩放，别等进度回来。
//
// paint()：默认模式是「按学科」，不依赖进度。等 loadProgress 的话，
//   fetch 那几十毫秒里全部节点是 SVG 默认的黑（被截图抓到过）。
// fit()：地图 2336×2194，不先缩放的话就按原始尺寸铺出来 ——
//   比视口大得多，看着像"页面被放大了一下"，然后才缩回去。
// 两个是同一个病：**把「等数据」当成了「等渲染」**，
// 可数据没回来时页面并不是空白，而是用默认样式渲染出来的一份错的。
//
// ⚠️ 位置有讲究：必须在 `let vx/vy/vs` **之后** —— 放前面会撞 TDZ
// （Cannot access 'vs' before initialization），整个主脚本当场中断，
// 所有按钮全绑不上。踩过。这中间几百行都是同步的，不会有渲染帧。
paint();
fit();
function fit(pad = 28) {
  const st = $("#stage").getBoundingClientRect();
  // 地图是竖长的（2336×2194）。早先按最短边缩 —— 结果是被高度卡住，
  // 字压到 5px。改成铺满宽度、纵向拖拽看；顶对齐还有个好处：
  // 一进来就是 L0「起点」，跟技能树的读法一致。
  vs = Math.max((st.width - pad * 2) / DATA.size[0], .06);
  const h = DATA.size[1] * vs;
  vx = (st.width - DATA.size[0] * vs) / 2;
  vy = h < st.height - pad * 2 ? (st.height - h) / 2 : pad;
  transform();
}
function focusNode(id) {
  const n = byId(id), st = $("#stage").getBoundingClientRect();
  vs = Math.max(vs, 1);
  vx = st.width / 2 - (n.x + n.w / 2) * vs;
  vy = st.height / 2 - (n.y + n.h / 2) * vs;
  transform();
}
const stage = $("#stage");
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * .0015), ns = Math.min(2.6, Math.max(.06, vs * k));
  vx = mx - (mx - vx) * (ns / vs); vy = my - (my - vy) * (ns / vs); vs = ns;
  transform();
}, { passive: false });
/* ⚠️ 这里**不能**用 stage.setPointerCapture()。
   指针被捕获到 stage 之后，click 的目标也跟着变成 stage，
   挂在节点上的 click 监听就再也不会触发 —— 真实鼠标点击节点会彻底失灵。
   （合成事件 dispatchEvent 绕过了原生命中测试，所以早先没测出来。）
   改成 document 级监听 move/up，既不丢捕获的好处，也不劫持 click 目标。 */
let drag = null, dragMoved = false;

const onMove = (e) => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) dragMoved = true;
  vx = drag.vx + (e.clientX - drag.x); vy = drag.vy + (e.clientY - drag.y); transform();
};
const onUp = () => {
  drag = null;
  stage.classList.remove("dragging");
  document.removeEventListener("pointermove", onMove);
  document.removeEventListener("pointerup", onUp);
  document.removeEventListener("pointercancel", onUp);
};
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".panel") || e.button !== 0) return;
  e.preventDefault();          // 掐掉浏览器的「开始选择文本 / 拖拽图片」
  drag = { x: e.clientX, y: e.clientY, vx, vy };
  dragMoved = false;           // 只在按下时重置 —— 要活到随后的 click 判断
  stage.classList.add("dragging");
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
});
// 双保险：万一还有漏网的（比如从空白处拖到画布外），直接把选区清掉
document.addEventListener("selectstart", (e) => {
  if (e.target.closest?.(".stage")) e.preventDefault();
});
// 点空白 = 收起路径。dragMoved 为真说明刚拖过，那次 click 不算数。
stage.addEventListener("click", (e) => {
  if (e.target.closest?.(".node") || e.target.closest?.(".panel") || dragMoved) return;
  select(null);
});

// 没有 pointerover/pointerout 监听 —— 悬停不触发任何重绘，鼠标划过是零成本的
gNodes.addEventListener("click", (e) => {
  // ⚠️ dragMoved 必须在这里也查一遍。stage 那层查了，但**事件先到这一层** ——
  // 拖拽结束时 mousedown/mouseup 落在同一个节点上，click 就派发到那个节点，
  // 于是"想扒拉图"变成"又选中了一下"。stage 那层的判断救不了，因为它后到。
  if (dragMoved) return;
  const g = e.target.closest(".node"); if (g) select(g.dataset.id);
});

/* 静态按钮上的图标：HTML 里只写 data-ico，路径表只此一份 */
document.querySelectorAll("[data-ico]").forEach((el) => {

const syncThemeIcon = () => {

/* ── 键盘盘点 ────────────────────────────────────────────────
   349 个节点靠"点节点 → 点按钮"要 700 下，标不完的。
   这里：选中一个节点后按 1/2/3/4 直接定级，并**自动跳到下一个** ——
   一路按下去就是一次盘点。

   下一个按**图上顺序**（上到下、左到右），不是按数据顺序 ——
   人的眼睛在图上是这么走的，跳着走会跟丢。 */
const ORDER = [...NODES].sort((a, b) => (a.y - b.y) || (a.x - b.x)).map((n) => n.id);
const nextAfter = (id) => {
  const i = ORDER.indexOf(id);
  if (i < 0) return null;
  // 跳过一个已选中但还没标过的节点没意义，就老实取下一个；
  // 到末尾回绕，方便补漏。
  return ORDER[(i + 1) % ORDER.length];
};
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { select(null); return; }
  // 在输入框里打字时不抢键
  if (e.target?.tagName === "INPUT" || e.target?.tagName === "TEXTAREA") return;
  if (!selected) return;

  const idx = "123".indexOf(e.key);   // 三档：verified 手标不了（见 CYCLE 上面的说明）
  if (idx >= 0) {
    e.preventDefault();
    // **标完不跳。** 原本按完 1-4 自动跳下一个
    // （本意是"一路按下去就是一次盘点"），实测反馈是「直接蹦到别的节点了」。
    // 标记是个**定点动作** —— 标完人还想看这个节点、还想接着扒拉图，
    // 工具不该自作主张把人挪走。想往前走，自己按方向键。
    setStatus(selected, CYCLE[idx]);   // ["none","studying","learned"]
    return;
  }
  // 想往前走的时候自己按。方向键 / 空格 —— 图上顺序（上到下、左到右）。
  if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    const to = nextAfter(selected);
    if (to) select(to, true);
    return;
  }
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
    e.preventDefault();
    const i = ORDER.indexOf(selected);
    if (i >= 0) select(ORDER[(i - 1 + ORDER.length) % ORDER.length], true);
  }
});
addEventListener("resize", () => fit());

// ══════════════════════════════════════════════════════════════════
// 日程视图（L6 时间容量）
// ══════════════════════════════════════════════════════════════════
// 三级数据写它们的人不同：busy = 他手标的 / planned = 教练排的（固化不重排）/
// actual = 实际用时（校准真实速度的唯一来源）。
//
// 这个视图**只读 planned、只写 busy** —— 排块是教练的活，页面上不给入口。
// 给了就会手滑改计划，那"计划"就不算数了，也没法拿它去对照实际。
let sched = { days: {} };
let schedAnchor = null;      // 窗口起点；null = 「今天 - 3 天」
let schedLoaded = false;

const HOUR_FROM = 8, HOUR_TO = 24;        // 8:00 - 24:00，16 格
const WINDOW_BACK = 3, WINDOW_DAYS = 10;  // 前 3 回顾 + 后 7 可排（方针 §4.1）

const pad2 = (n) => String(n).padStart(2, "0");
const ymdOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const ymdToday = () => ymdOf(new Date());

function schedStart() {
  if (schedAnchor) return new Date(`${schedAnchor}T00:00:00`);
  const t = new Date();
  const d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  d.setDate(d.getDate() - WINDOW_BACK);
  return d;
}

/* ── 时间 ↔ 坐标 ──
   只有两个刻度：日期用 "YYYY-MM-DD" 字符串比（定长同格式，字典序=时间序），
   列内位置用「离 8:00 多少分钟」。别再引入第三种刻度（比如像素直接参与运算），
   多一层转换就多一处能写错的地方。 */
const TOTAL_MIN = (HOUR_TO - HOUR_FROM) * 60;
// 落点吸附粒度：**5 分钟**。
// 第一版是 15 分钟，太粗了（「粒度不够，能不能 1/5 分钟一档」）——
// 他的时间不是按刻钟走的（13:20 下课、19:05 开始都常见），
// 15 分钟一档会逼他要么多标要么少标。5 分钟已经比手表的分钟刻度还细，
// 而列高 400+px 下每档约 2px，鼠标能停住 —— 再细就没有可操作性了。
const SNAP = 5;

// 块型短名。**必须和 host 的 SCHED_KINDS[k].name 逐字一致** ——
// 不一致时页面会拿 id 兜底显示（不会崩），但那块看着就像坏了。
// host 是真相源，这里只管显示。verify.mjs 有一条盯着这个一致性。
const KIND_NAME = { cycle: "题目循环", review: "复习一题", exam: "章节检测" };

const minToHM = (m) => {
  const t = HOUR_FROM * 60 + m;
  return `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`;
};
const hmToMin = (s) => {
  const p = String(s ?? "").split(":");
  const h = Number(p[0]), m = Number(p[1]);
  return Number.isFinite(h) && Number.isFinite(m) ? (h - HOUR_FROM) * 60 + m : null;
};
/** 列内 y 像素 → 分钟（吸附 + 夹在 [0, TOTAL_MIN]） */
const yToMin = (y, colH) =>
  Math.max(0, Math.min(TOTAL_MIN, Math.round(((y / colH) * TOTAL_MIN) / SNAP) * SNAP));
const pct = (min) => `${(min / TOTAL_MIN) * 100}%`;

/* 事由 → 颜色档。要求「不要全一个黄」。
   走**自动配色**而不是让他手选：同一种事永远同一个色（一致性靠函数保证，
   不靠他每次都记得选对），而且他少一步操作。
   顺序有讲究 —— 先匹配的赢："打比赛"要判成比赛，不能被别的词抢走。 */
/* ⚠️ 顺序 = 优先级，**越具体的越靠前**。
   踩过的坑：标成「排练和宣讲」这类含"赛"字的，会被 red 抢走判成比赛 ——
   可那是宣讲不是比赛，颜色误导。所以"宣讲/排练"必须排在"赛"前面。
   关键词是照**真实会写的词**收的（课表 / 午睡 / 陪…）：
   第一版按想当然写"课""睡觉"，真实用词一个都没命中，全掉进兜底 ——
   那看着就跟随机配色一样。 */
const EVENT_TAGS = [
  ["violet", ["宣讲", "排练", "社团", "活动", "讲座", "开会", "例会", "会议", "值班"]],
  ["red", ["比赛", "模拟赛", "训练赛", "vp", "cf", "codeforces", "icpc", "测评"]],
  // "上"兜住「上高数」这种不写"课"字的课表 —— 口语里就是这么写的
  ["blue", ["上课", "课", "实验", "作业", "考试", "自习", "复习", "上"]],
  ["cyan", ["兼职", "工作", "实习", "项目", "面试"]],
  ["teal", ["球", "运动", "健身", "跑步", "锻炼", "体测"]],
  ["slate", ["饭", "睡", "休息", "玩", "游戏", "洗澡", "陪"]],
];

function colorOf(label) {
  const s = String(label ?? "").trim();
  if (!s) return "";
  const low = s.toLowerCase();
  for (const [c, keys] of EVENT_TAGS) {
    if (keys.some((k) => low.includes(k))) return c;
  }
  // 兜底：按文字算一个**稳定**的档位（同输入同输出），而且**只从蓝青系里挑** ——
  // 兜底色要是乱跳，整体观感立刻退回"随机配色"（第一版就是这么翻车的）。
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.codePointAt(0)) % 997;
  return ["blue", "teal", "slate"][h % 3];
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderSched() {
  const start = schedStart(), today = ymdToday();
  const days = [];
  for (let i = 0; i < WINDOW_DAYS; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  $("#schedSpan").textContent = `${ymdOf(days[0])} ～ ${ymdOf(days[WINDOW_DAYS - 1])}`;

  const DOW = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const parts = ['<div class="corner"></div>'];
  for (const d of days) {
    const key = ymdOf(d);
    const cls = key === today ? " today" : key < today ? " past" : "";
    parts.push(`<div class="dh${cls}"><div class="dow">${DOW[d.getDay()]}</div>` +
      `<div class="dnum">${d.getMonth() + 1}/${d.getDate()}</div></div>`);
  }
  // 左侧整点标签：现在它是**唯一的纵向定位依据**了（列里不放横线）。
  // 不画最后一个（24:00）—— 它正好压在底边上，标签会被切掉一半。
  parts.push('<div class="stimes">');
  for (let h = HOUR_FROM; h < HOUR_TO; h++) {
    parts.push(`<span style="top:${((h - HOUR_FROM) / (HOUR_TO - HOUR_FROM)) * 100}%">` +
      `${pad2(h)}:00</span>`);
  }
  parts.push("</div>");
  // 每天一列。busy 画成**连续块**不是拼格子 —— 拼的话接缝处会有 1px 缝。
  for (const d of days) {
    const key = ymdOf(d);
    const day = sched.days[key] ?? {};
    const bars = (day.busy ?? []).map((b, i) => {
      const a = hmToMin(b.from), z = hmToMin(b.to);
      if (a === null || z === null || z <= a) return "";
      const has = String(b.label ?? "").trim().length > 0;
      const col = colorOf(b.label);
      const mins = z - a;
      // 三档：够高放两行 / 中等放一行 / 太矮不放字（信息挂 title）
      const size = mins >= 75 ? "s-full" : mins >= 40 ? "s-mid" : "s-mini";
      const body = size === "s-full"
        ? `<span class="t">${esc(b.from)}–${esc(b.to)}</span>${has ? esc(b.label) : "—"}`
        : size === "s-mid"
          ? (has ? esc(b.label) : esc(b.from))
          : "";
      // title 里永远放**完整**信息 —— 小块的文字虽然不显示，
      // 但鼠标停上去能看全，这是它不丢信息的兜底。
      const tip = `${b.from}–${b.to}${has ? `　${b.label}` : "（没写事由）"}`;
      return `<div class="bbar ${size}${has ? (col ? ` c-${col}` : "") : " nolabel"}" ` +
        `data-i="${i}" title="${esc(tip)}" style="top:${pct(a)};height:${pct(mins)}">` +
        `${body}</div>`;
    }).join("");
    // planned：教练排的块，**只读**（页面上不给改动入口，理由见上面 CSS 那段）。
    // 画在 busy 之后，同位置时压在忙事上面 —— 正常情况两者不重叠（工具排块时
    // 会拦），真压上了说明数据是手改进去的，那时候看得见比看不见强。
    const plans = (day.planned ?? []).map((b) => {
      const a = hmToMin(b.from), z = hmToMin(b.to);
      if (a === null || z === null || z <= a) return "";
      const mins = z - a;
      const kind = String(b.kind ?? "");
      // 地图改过名、甚至删过节点，而计划是历史数据 ——
      // 查不到名字就退回 id，**不能因为查不到就不画**（那等于计划凭空消失）。
      const nm = byId(b.node)?.name ?? String(b.node ?? "");
      const size = mins >= 75 ? "s-full" : mins >= 40 ? "s-mid" : "s-mini";
      // 中等高度（40~74 分钟，循环块正好 60）挤不下两行，但**时间要留住** ——
      // busy 那边中档只放事由就够（他自己知道标了什么），
      // planned 不一样：这是要他**照着执行**的，"几点开始"就是那条执行信息。
      // 长了会被 nowrap 裁掉，全名挂在 title 上。
      const body = size === "s-full"
        ? `<span class="t">${esc(b.from)}–${esc(b.to)}</span>${esc(nm)}`
        : size === "s-mid" ? `${esc(b.from)} ${esc(nm)}` : "";
      const tip = `${b.from}–${b.to}　${KIND_NAME[kind] ?? kind}　${nm}` +
        (kind === "cycle" ? "　（40 自己做 → 10 解决遗留 → 10 重写）" : "");
      return `<div class="pbar k-${esc(kind)} ${size}" title="${esc(tip)}" ` +
        `style="top:${pct(a)};height:${pct(mins)}">${body}</div>`;
    }).join("");
    // 列里**只有内容，没有分隔线**（那些横线是明确要求去掉的）。
    // 定位靠左边的时间标签 + 悬停跟随线。
    const cls = key === today ? " today" : key < today ? " past" : "";
    parts.push(`<div class="dcol${cls}" data-date="${key}">${bars}${plans}</div>`);
  }
  $("#schedGrid").innerHTML = parts.join("");
}

/* ── 拖出一段「有事」──────────────────────────────────────────────
   交互：按住 → 拖 → 松手弹框写事由，落点吸附 15 分钟。

   为什么不做格子点选（第一版就是那样，被否了）：1 小时的分块太粗了 ——
   人的时间不是按整点切的，用格子会逼你要么多标要么少标
   （13:20 下课，格子只能点 13:00 或 14:00）。拖就没有这个问题。 */
let schedDrag = null;

$("#schedGrid").addEventListener("pointerdown", (e) => {
  const col = e.target.closest?.(".dcol");
  if (!col) return;
  if (e.target.closest(".bbar")) return;         // 点已有的块走编辑，不拖
  if (col.dataset.date < ymdToday()) return;     // 回顾期只读
  const r = col.getBoundingClientRect();
  const m = yToMin(e.clientY - r.top, r.height);
  const el = document.createElement("div");
  el.className = "selbar";
  el.style.top = pct(m);
  el.style.height = pct(SNAP);
  col.appendChild(el);
  schedDrag = { col, date: col.dataset.date, a: m, b: m, el };
  col.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});

/* 悬停指示：一条横贯全宽的细线 + 跟着鼠标的时间标签。
   踩过「鼠标放上去看不到位置的时间，很容易选错」——
   刻度线只说明"整点在哪"，不回答"我现在会选到哪一分钟"。 */
const hoverLine = document.createElement("div");
hoverLine.className = "hoverline";
hoverLine.hidden = true;
const hoverLabel = document.createElement("div");
hoverLabel.className = "hoverlabel";
hoverLabel.hidden = true;
document.body.append(hoverLine, hoverLabel);
const hideHover = () => { hoverLine.hidden = true; hoverLabel.hidden = true; };

/** 把指示线放到某列的第 m 分钟，标签跟着鼠标。
 *  文字由调用方给 —— 悬停时给单个时刻（"会选到哪"），
 *  拖拽时给区间（"起止到哪"，因为那时候他已经知道起点了，
 *  关心的是松手会落在哪一分钟、总共多长）。 */
function showHoverAt(rect, m, e, text) {
  const g = $("#schedGrid").getBoundingClientRect();
  hoverLine.hidden = false;
  hoverLine.style.left = `${g.left}px`;
  hoverLine.style.width = `${g.width}px`;
  hoverLine.style.top = `${rect.top + (m / TOTAL_MIN) * rect.height}px`;
  hoverLabel.hidden = false;
  hoverLabel.textContent = text;
  hoverLabel.style.left = `${e.clientX + 14}px`;
  hoverLabel.style.top = `${e.clientY - 10}px`;
}

$("#schedGrid").addEventListener("pointermove", (e) => {
  if (schedDrag) {
    // 拖动中：预览条画出"多长"，标签画出"起止到哪"。
    // ⚠️ 一开始这里是把指示**收起来**的（怕两套线看花眼）——
    // 踩过：「按下鼠标后时间标又不存在了，不知道准备放开的时间是多少」。
    // 拖动时才是最需要它的时候，收起来正好反了。
    const r = schedDrag.col.getBoundingClientRect();
    schedDrag.b = yToMin(e.clientY - r.top, r.height);
    const a = Math.min(schedDrag.a, schedDrag.b), z = Math.max(schedDrag.a, schedDrag.b);
    schedDrag.el.style.top = pct(a);
    schedDrag.el.style.height = pct(Math.max(z - a, SNAP));
    showHoverAt(r, z, e, `${minToHM(a)} – ${minToHM(z)}`);
    return;
  }
  const col = e.target.closest?.(".dcol");
  if (!col || col.dataset.date < ymdToday()) { hideHover(); return; }   // 回顾期不给指示
  const r = col.getBoundingClientRect();
  const m = yToMin(e.clientY - r.top, r.height);
  showHoverAt(r, m, e, minToHM(m));
});

$("#schedGrid").addEventListener("pointerleave", hideHover);

$("#schedGrid").addEventListener("pointerup", (e) => {
  if (!schedDrag) return;
  const { col, date, el } = schedDrag;
  const a = Math.min(schedDrag.a, schedDrag.b), z = Math.max(schedDrag.a, schedDrag.b);
  schedDrag = null;
  el.remove();
  if (z - a < SNAP) return;          // 只是点了一下，没拖出区间 —— 什么都不做
  openPop(date, a, z, null, e.clientX, e.clientY);
});

/* 点已有的块 → 改事由 / 删掉 */
$("#schedGrid").addEventListener("click", (e) => {
  const bar = e.target.closest(".bbar");
  if (!bar) return;
  const col = bar.closest(".dcol");
  if (!col || col.dataset.date < ymdToday()) return;
  const b = (sched.days[col.dataset.date]?.busy ?? [])[Number(bar.dataset.i)];
  if (!b) return;
  const a = hmToMin(b.from), z = hmToMin(b.to);
  if (a === null || z === null) return;
  openPop(col.dataset.date, a, z, Number(bar.dataset.i), e.clientX, e.clientY);
});

/* ── 写「什么事」的小浮层 ─────────────────────────────────────────
   事由不是装饰：**它是给小鲸看的**。小鲸靠它知道"这段为什么不能用"，
   而不是只看到一个光秃秃的忙碌标记 —— 那样它排程时只能当黑箱。 */
let popEl = null;
const closePop = () => { popEl?.remove(); popEl = null; };

function openPop(date, aMin, zMin, idx, px, py) {
  closePop();
  const cur = idx === null ? null : ((sched.days[date]?.busy ?? [])[idx] ?? null);
  const mins = zMin - aMin;
  const dur = mins >= 60
    ? `${(mins / 60).toFixed(mins % 60 ? 1 : 0)} 小时`
    : `${mins} 分钟`;
  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML =
    `<div class="pt">${date}　${minToHM(aMin)} – ${minToHM(zMin)}` +
    `<span style="color:var(--text-4);font-weight:500">　${dur}</span></div>` +
    `<input type="text" maxlength="40" placeholder="什么事？（上课 / 开会 / 打比赛…）" ` +
    `value="${esc(cur?.label ?? "")}">` +
    `<div class="prow">` +
    (cur ? `<button class="del">删除</button>` : "") +
    `<button class="cancel">取消</button><button class="pri ok">保存</button>` +
    `</div>`;
  document.body.appendChild(el);
  popEl = el;
  const w = 236, h = el.offsetHeight || 132;
  el.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, (px ?? innerWidth / 2) - w / 2))}px`;
  el.style.top = `${Math.max(8, Math.min(innerHeight - h - 8, (py ?? 200) + 10))}px`;

  const inp = el.querySelector("input");
  inp.focus();
  inp.select();

  const commit = () => {
    const list = [...(sched.days[date]?.busy ?? [])];
    const entry = { from: minToHM(aMin), to: minToHM(zMin), label: inp.value.trim() };
    if (cur) list[idx] = entry; else list.push(entry);
    closePop();
    saveBusy(date, list);
  };
  el.querySelector(".ok").onclick = commit;
  el.querySelector(".cancel").onclick = closePop;
  el.querySelector(".del")?.addEventListener("click", () => {
    const list = [...(sched.days[date]?.busy ?? [])];
    list.splice(idx, 1);
    closePop();
    saveBusy(date, list);
  });
  inp.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); commit(); }
    else if (ev.key === "Escape") { ev.preventDefault(); closePop(); }
  });
}

// 点浮层外面关掉它（和面板/弹层的习惯一致）
document.addEventListener("pointerdown", (e) => {
  if (popEl && !popEl.contains(e.target)) closePop();
});

/* 乐观更新 + 失败回滚 —— 点了没反应比点错了更让人困惑。 */
async function saveBusy(date, list) {
  const before = JSON.parse(JSON.stringify(sched));
  const sorted = [...list].sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0));
  const day = { ...(sched.days[date] ?? {}) };
  if (sorted.length) day.busy = sorted; else delete day.busy;
  if (Object.keys(day).length) sched.days[date] = day; else delete sched.days[date];
  renderSched();
  try {
    const r = await fetch("./api/schedule", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date, field: "busy", value: sorted }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.reject || "写失败");
  } catch (err) {
    sched = before;
    renderSched();
    setNote(`<b>没存上</b>：${err.message}`, true);
  }
}

async function loadSchedule() {
  try {
    const r = await fetch("./api/schedule");
    const j = await r.json();
    if (!j.ok) throw new Error(j.reject || "读日程失败");
    sched = { days: j.days || {} };
  } catch (e) {
    // 读不到就明说，别退回"全空"装作没事 —— 那看着像"你没标过"
    setNote(`<b>日程读不到</b>：${e.message}`, true);
    sched = { days: {} };
  }
  renderSched();
}

/* ⚠️ 视图状态要写进**地址栏**，不能只改内存。
   踩过：「点日程以后刷新，又回到技能树了」——
   原来 setView 只改 DOM，刷新就丢。地址栏是唯一真相，刷新/收藏/分享都靠它。
   （用 replaceState 不用 pushState：切视图不该污染后退历史，
   按一下后退跳回"上一个视图"而不是"上一页"会让人莫名其妙。） */
function setView(v) {
  document.body.dataset.view = v;
  document.querySelectorAll("#viewSeg button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  const want = v === "sched" ? "#sched" : "";
  if ((location.hash || "") !== want) {
    history.replaceState(null, "", want || location.pathname + location.search);
  }
  if (v === "sched") {
    if (!schedLoaded) { schedLoaded = true; loadSchedule(); } else renderSched();
  }
}

$("#viewSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});
$("#schedPrev").onclick = () => { const s = schedStart(); s.setDate(s.getDate() - 3); schedAnchor = ymdOf(s); renderSched(); };
$("#schedNext").onclick = () => { const s = schedStart(); s.setDate(s.getDate() + 3); schedAnchor = ymdOf(s); renderSched(); };
$("#schedToday").onclick = () => { schedAnchor = null; renderSched(); };

// 先把进度拉回来再画 —— 不然会先闪一屏「全部未学」，然后才跳成真实状态。
// 那一下闪烁会让人以为自己之前标的没存上。
loadProgress().then(() => {
  paint(); apply(); fit(); syncThemeIcon();
  // 刷新后停在原来的视图 —— 地址栏是唯一真相（读它，别读内存）
  if (location.hash === "#sched") setView("sched");
});
</script>
</body>
