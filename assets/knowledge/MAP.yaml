parallel_branches:
  - a: 树状数组
    b: 线段树
    note: 区间维护的两条独立路线，走通一条即可
  - a: 块状数据结构
    b: 线段树
    note: 分块是线段树的朴素退路，学不动时可先走分块
  - a: Treap
    b: Splay 树
    note: 平衡树任选一种写熟即可，另一种按需补
  - a: 后缀数组 (SA)
    b: 后缀自动机 (SAM)
    note: 字符串难题的两条路线，先走通一条
  - a: 单调队列/单调栈优化
    b: 线段树
    note: 都是优化 DP 转移的手段
