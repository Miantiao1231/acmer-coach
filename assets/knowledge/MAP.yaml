# ══════════════════════════════════════════════════════════════
# MAP.yaml — 教练地图 v3（前置 = depends，分类 = parent）
#
# 生成方式：coach/build_map.py（OI-wiki 导航 351 条 + knowledge/DEPENDS.yaml）
#   ⚠️ 不要手改本文件 —— 改 DEPENDS.yaml 再重跑 build_map.py。
#
# 结构约定：
#   depends  前置。学这个之前必须先掌握的直接前置。空列表 = 确认的根节点，
#            null = 还没铺（**不是根，是不知道**，别把它排到最前面）。
#   parent   分类归属，**只用于分组显示，不是前置**。
#            「树上问题」是抽屉不是知识点 —— 它不参与任何依赖计算。
#   tier     这个知识点重不重要：core/normal/rare/skip。
#            来自 knowledge/NODE_META.yaml（人手维护），本文件只做合并。
#   entry    题池的 p25，≈「什么水平开始学得起」。**只有有题池的节点才有**。
#            来自 knowledge/NODE_ENTRY.yaml（机器算，跑 build-node-meta.mjs）。
# ══════════════════════════════════════════════════════════════

