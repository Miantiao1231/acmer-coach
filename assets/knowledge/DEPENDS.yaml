# ══════════════════════════════════════════════════════════════
# DEPENDS.yaml — 知识点前置关系（唯一真相源）
#
# 语义：requires = 学这个节点之前，必须先掌握的直接前置。
#   ⚠️ 必须显式写全，不靠 parent 顶替 ——
#      parent 是「分类归属」（这俩放一起讲），requires 是「前置」（不会这个学不了那个）。
#   只写「直接」前置：A→B→C 时 C 只写 B。传递隐含的会被 _fill_fix.py 自动清掉。
#   空列表 [] = 根节点；条目不存在 = 还没铺（不是根）。
#
# 维护：改本文件 → 跑 coach/build_map.py 重新生成 MAP.yaml
#       看形状 → 跑 coach/analyze_map.py
#
# 进度：首轮已铺完 349/349，0 未铺。
#   ⚠️ **首轮质量参差** —— 依赖边是人工整理的，没有逐条复核过。
#      存疑的边见文件内注释（如 PQ 树当根）。欢迎提 issue 修正。
# ══════════════════════════════════════════════════════════════

