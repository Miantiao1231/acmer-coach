# ══════════════════════════════════════════════════════════════
# NODE_META.yaml —— 知识点标注 · **人维护的源文件**
#
# 这份文件回答地图回答不了的那个问题：
#   地图说「谁是谁的前置」   →  **允许**学什么
#   这份说「这知识点重不重要」→  **该不该**学
#
# 两者都满足，才轮到"现在学不学得起"（那个是机器算的，见 NODE_ENTRY.yaml）。
#
# ══ 判定标准 ══════════════════════════════════════════════════
#
# 校准目标：**ICPC 区域赛稳定拿牌**（远期 WF 领奖台）。
# 不是"CF 上分需要什么"——这两者的侧重不一样，见下面的差异记录。
# 校准对象：**全能型选手**，不针对特定队伍角色做特化。
# ⚠️ 这是**默认校准**。你的目标不一样（比如只想稳过区域赛签到）就该自己改这份文件
#    —— 它本来就是人维护的源文件，改成你自己的判断是对的用法。
#
#   core    区域赛签到到中档题的主力。不会它，题就读不懂或做不出来。
#   normal  常见，值得学。但不决定成败——少一个不至于崩。
#   rare    偶见，或只在特定题型里用得上。时间紧张时靠后。
#   skip    ICPC 区域赛基本不考（OI 特有 / 纯理论 / 库已代劳的实现细节）。
#
# ══ 依据来源（按可信度） ══════════════════════════════════════
#
# 1. 粗粒度考频共识（多方一致，但**都没有挂数据**——是共识不是证据）：
#      DP、图论最高 ／ 数据结构、贪心、构造、模拟次之
#      基础算法是支撑 ／ 字符串、计算几何、高级数论靠后
# 2. 论文 [Finding Winning Patterns in ICPC data]（Utrecht，1342 道区域赛+WF 真题
#    2012-2018，专家标注 9 类）。可引用的结论只有一条：**data structures 类
#    与其它类差异最显著**。细分占比拿不到（原始页面 403）。
# 3. Halim《Competitive Programming》Table 1.1「近年 ICPC 亚洲区域赛题型」，
#    作者是 ICPC Asia 赛事总监——这批来源里唯一有执业资格的。内容没抓到。
# 4. 本机题库算出的**入门段位**（NODE_ENTRY.yaml，可复现）——用来校验：
#    一个标 core 的知识点如果入门段位 2600，那它对初学者不是 core 是 rare。
#
# ⚠️ 不存在官方 ICPC 考纲。World Finals 技术文档只规定编程环境（语言/文件/沙箱）。
# ⚠️ 网上被转得最多的《2025 亚洲区域赛算法类型分布统计》经核实**通篇没有数字**，
#    是个人经验帖冒充统计，不作为依据。
#
# ══ CF 路线 vs ICPC 路线的差异（校准目标的由来）══════════════
#
# · CF：个人赛，2 小时 7 题，Div 分级，预测试+hack，重**观察和数学**
# · ICPC：3 人 1 机，5 小时 8-13 题，罚时制，重**综合与实现**
# · 赛区差异极大：欧洲重算法数学（有时超 WF），美国重模拟代码量，亚洲居中
#
# 落到具体：**数据结构类在亚洲区域赛比在 CF 上更重要**（CF 的 "Chinese-ness"
# 不如亚洲赛区明显）。所以本文件在数据结构和实现细节上，比 CF 路线图给得更高。
#
# ══ 写法约定 ═════════════════════════════════════════════════
#
# · 只写 `tier`。**偏离同域默认的**才加 `why` —— 那些正是该人工复核的。
# · 每个域名在 group_defaults 里给一个默认 tier，节点没写的继承它。
# · 节点名必须与 MAP.yaml 逐字相同（build_map.py 按名字合并，对不上会报错）。
# ══════════════════════════════════════════════════════════════

